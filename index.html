<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Santa Tracker</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600|Lobster|Google+Sans:400,500,700" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap">
  {
    "imports": {
      "lit-element": "./vendor/lit-element/lit-element.js",
      "lit-html": "./vendor/lit-html/lit-html.js",
      "lit-html/lit-html.js": "./vendor/lit-html/lit-html.js",
      "lit-html/lib/shady-render.js": "./vendor/lit-html/lib/shady-render.js",
      "lit-html/directives/if-defined.js": "./vendor/lit-html/directives/if-defined.js",
      "lit-html/directives/unsafe-html.js": "./vendor/lit-html/directives/unsafe-html.js"
    }
  }
  </script>
</head>
<body>
  <santa-button id="music-toggle" aria-label="Mute"></santa-button>
  <modvil-tracker></modvil-tracker>

  <div id="chat-dock">
    <div id="chat-consent" hidden>
      <h2>Enable Chat?</h2>
      <p>
        This opens an external LiveChat room. Messages and logins are handled by
        a third-party site, so you may be exposed to outside people and content.
      </p>
      <label class="chat-keep">
        <input id="chat-keep" type="checkbox" />
        Keep my decision
      </label>
      <div class="chat-actions">
        <button id="chat-no" type="button">No</button>
        <button id="chat-yes" type="button">Yes</button>
      </div>
    </div>
    <div id="chat-frame-wrap" hidden>
      <iframe
        id="chat-frame"
        title="LiveChat"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allow="clipboard-write"
        src="about:blank"></iframe>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/chat-gate.js"></script>
  <script
    src="https://livepill.lonormal.com/livepill.js"
    data-site="gstreplay"
    data-label="live"
    data-position="bottom-left"
    data-bg="#111111"
    data-color="#ffffff"
    data-label-color="#c8c8c8"
    data-dot="#3fc380"
    data-font="Google Sans, Roboto, Helvetica, Arial, sans-serif"
    data-size="12px"
    data-offset="18px"></script>
</body>
</html>
